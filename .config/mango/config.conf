# fcitx envs
env=QT_IM_MODULE,fcitx
env=QT_IM_MODULES,wayland;fcitx
env=SDL_IM_MODULE,fcitx
env=XMODIFIERS,@im=fcitx
env=GLFW_IM_MODULE,ibus

# Start fcitx5 input method
exec-once=fcitx5 -d &

# DMS shell
exec-once=dbus-update-activation-environment --systemd --all
exec-once=systemctl --user start mango-session.target

# Custom config
allow_tearing=1
enable_hotarea=0
sloppyfocus=0 # Focus doesn't follow mouse
no_border_when_single=1
smartgaps=1
drag_tile_to_tile=1
circle_layout=tile,scroller
mouse_accel_profile=0

# Tiling layout specifics
new_is_master=0

# Scroller layout specifics
scroller_structs=2
scroller_ignore_proportion_single=0
scroller_prefer_center=1
scroller_default_proportion=0.90

# Shadows
shadows=1
layer_shadows=1
shadows_size=8
shadows_blur=25
shadowscolor=0x000000aa

source=./keybinds.conf
source=./windowrules.conf
source-optional=./hardware-specific.conf
source=./dms/outputs.conf
source=./dms/layout.conf
source=./dms/colors.conf
source=./dms/cursor.conf
